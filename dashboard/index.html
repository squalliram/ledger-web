<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Flag Guardian — Governance Report</title>
<style>
  :root {
    --bg: #14120f;
    --panel: #1c1a17;
    --line: #2c2925;
    --text: #f2efe9;
    --muted: #9a958c;
    --orange: #ff6a2b;
    --high: #ff5c5c;
    --medium: #ffb020;
    --low: #6fcf97;
    --healthy: #6fcf97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 40px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  .eyebrow {
    color: var(--orange);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  h1 { margin: 0 0 4px 0; font-size: 28px; }
  .sub { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
  .summary { display: flex; gap: 16px; margin-bottom: 28px; }
  .stat {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .stat .n { font-size: 30px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .owner { color: var(--muted); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge.high { background: rgba(255,92,92,0.15); color: var(--high); }
  .badge.medium { background: rgba(255,176,32,0.15); color: var(--medium); }
  .badge.low { background: rgba(111,207,151,0.15); color: var(--low); }
  .badge.healthy { background: rgba(111,207,151,0.15); color: var(--healthy); }
  .rec { color: var(--muted); max-width: 320px; }
  .footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Flag Guardian</div>
    <h1 id="repo-title">Governance Report</h1>
    <div class="sub" id="generated-at"></div>

    <div class="summary" id="summary"></div>

    <table>
      <thead>
        <tr>
          <th>Flag</th>
          <th>Owner</th>
          <th>Location</th>
          <th>Risk</th>
          <th>Recommendation</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="footer">Generated by Flag Guardian · scan target: <span id="repo-name"></span></div>
  </div>

  <script id="report-data" type="application/json">{"generatedAt": "2026-09-16T10:55:18.926756Z", "repo": "ledger-web", "summary": {"total": 8, "healthy": 1, "atRisk": 7}, "flags": [{"key": "ledger.newCheckoutFlow", "owner": "checkout-team", "location": "routes/checkout.js", "riskLevel": "healthy", "findings": ["none"], "recommendation": "No action needed \u2014 owned, fallback present, actively used."}, {"key": "pricing.dynamicDiscountV2", "owner": "pricing-team", "location": "services/pricing.js", "riskLevel": "medium", "findings": ["stale_at_full_rollout"], "recommendation": "Schedule cleanup: stale at full rollout"}, {"key": "payments.legacyRefundPath", "owner": "payments-team", "location": "services/refunds.js", "riskLevel": "high", "findings": ["no_fallback"], "recommendation": "Prioritize: no fallback"}, {"key": "kyc.oldVerificationFlow", "owner": null, "location": "services/kyc.js", "riskLevel": "high", "findings": ["overdue_removal"], "recommendation": "Prioritize: overdue removal"}, {"key": "search.legacyElasticQuery", "owner": "search-team", "location": "legacy/search.js", "riskLevel": "low", "findings": ["dead_commented_out"], "recommendation": "Safe cleanup \u2014 delete the commented block and the config entry."}, {"key": "notifications.smsFallbackDisabled", "owner": null, "location": "flags.config.json", "riskLevel": "medium", "findings": ["orphaned_in_config"], "recommendation": "No code references found. Confirm it's truly dead, then delete the config entry."}, {"key": "reporting.exportV3", "owner": "data-platform", "location": "flags.config.json", "riskLevel": "medium", "findings": ["orphaned_in_config"], "recommendation": "No code references found. Confirm it's truly dead, then delete the config entry."}, {"key": "FEATURE_NEW_DASHBOARD_ENABLED", "owner": null, "location": "services/dashboard.js", "riskLevel": "high", "findings": ["hardcoded_bypasses_governance"], "recommendation": "Move behind flags.config.json with an owner and a real kill switch."}]}</script>
  <script>
    const report = JSON.parse(document.getElementById("report-data").textContent);

    document.getElementById("repo-title").textContent = "Flag Governance Report";
    document.getElementById("repo-name").textContent = report.repo;
    document.getElementById("generated-at").textContent =
      "Generated " + new Date(report.generatedAt).toLocaleString();

    const summary = document.getElementById("summary");
    const stats = [
      { n: report.summary.total, l: "Total flags" },
      { n: report.summary.atRisk, l: "At risk" },
      { n: report.summary.healthy, l: "Healthy" },
    ];
    stats.forEach(s => {
      const div = document.createElement("div");
      div.className = "stat";
      div.innerHTML = `<div class="n">${s.n}</div><div class="l">${s.l}</div>`;
      summary.appendChild(div);
    });

    const order = { high: 0, medium: 1, low: 2, healthy: 3 };
    const rows = document.getElementById("rows");
    [...report.flags].sort((a, b) => order[a.riskLevel] - order[b.riskLevel]).forEach(f => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="key">${f.key}</td>
        <td class="owner">${f.owner || "— none —"}</td>
        <td class="owner">${f.location}</td>
        <td><span class="badge ${f.riskLevel}">${f.riskLevel}</span></td>
        <td class="rec">${f.recommendation}</td>
      `;
      rows.appendChild(tr);
    });
  </script>
</body>
</html>
